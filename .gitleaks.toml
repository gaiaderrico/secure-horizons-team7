# Gitleaks config: default rules, plus an allowlist for synthetic test data.
# mirage/fakes.py and .env.example contain only invented values (no real secrets).
[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures, empty env template, and the fake canary beacon format"
paths = ['''mirage/fakes\.py''', '''\.env\.example''']
# lmn_canary_... are deliberately-fake honeytokens (BEACON_PREFIX), never real secrets.
# They legitimately appear in fakes, tests and docs by design.
regexes = ['''lmn_canary_[0-9A-Fa-fx]+''']
